name: Deploy Pipeline

on:
  push:
    branches:
      - master
      - staging
    tags:
      - 'v[0-9]+.*'
      - 'v[0-9]+.*-stg'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: |
      github.ref_type == 'tag' && 
      startsWith(github.ref_name, 'v') && 
      !endsWith(github.ref_name, '-stg') &&
      github.event.base_ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag format không hợp lệ. Yêu cầu format: v1.x.x"
            exit 1
          fi
          echo "✅ Tag format hợp lệ: $TAG_NAME"

      - name: Verify branch is master
        run: |
          BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/master' || true)
          if [ -z "$BRANCH" ]; then
            echo "❌ Tag không thuộc branch master"
            exit 1
          fi
          echo "✅ Tag thuộc branch master"

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying version ${{ github.ref_name }} to PRODUCTION"
          echo "Branch: master"
          echo "Tag: ${{ github.ref_name }}"
          # Thêm logic deploy production của bạn ở đây
          # Ví dụ:
          # - Build Docker image
          # - Push to production registry
          # - Deploy to production cluster
          # - Run smoke tests

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployment thành công!"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: |
      github.ref_type == 'tag' && 
      startsWith(github.ref_name, 'v') && 
      endsWith(github.ref_name, '-stg') &&
      github.event.base_ref == 'refs/heads/staging'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stg$ ]]; then
            echo "❌ Tag format không hợp lệ. Yêu cầu format: v1.x.x-stg"
            exit 1
          fi
          echo "✅ Tag format hợp lệ: $TAG_NAME"

      - name: Verify branch is staging
        run: |
          BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/staging' || true)
          if [ -z "$BRANCH" ]; then
            echo "❌ Tag không thuộc branch staging"
            exit 1
          fi
          echo "✅ Tag thuộc branch staging"

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying version ${{ github.ref_name }} to STAGING"
          echo "Branch: staging"
          echo "Tag: ${{ github.ref_name }}"
          # Thêm logic deploy staging của bạn ở đây
          # Ví dụ:
          # - Build Docker image
          # - Push to staging registry
          # - Deploy to staging cluster
          # - Run integration tests

      - name: Notify success
        if: success()
        run: |
          echo "✅ Staging deployment thành công!"

  notification:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "📢 Production deployment: SUCCESS"
          fi
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "📢 Staging deployment: SUCCESS"
          fi
          # Thêm logic notification của bạn ở đây
          # Ví dụ: Slack, Discord, Email, etc.