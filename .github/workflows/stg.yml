name: Deploy Pipeline

on:
  push:
    branches:
      - master
      - staging
    tags:
      - 'v[0-9]+.*'
      - 'v[0-9]+.*-stg'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Chỉ chạy khi push tag vào branch master và tag không có suffix -stg
    if: |
      github.ref_type == 'tag' && 
      startsWith(github.ref_name, 'v') && 
      !endsWith(github.ref_name, '-stg') &&
      github.event.base_ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag format không hợp lệ. Yêu cầu format: v1.x.x"
            exit 1
          fi
          echo "✅ Tag format hợp lệ: $TAG_NAME"

      - name: Verify branch is master
        run: |
          BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/master' || true)
          if [ -z "$BRANCH" ]; then
            echo "❌ Tag không thuộc branch master"
            exit 1
          fi
          echo "✅ Tag thuộc branch master"

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying version ${{ github.ref_name }} to PRODUCTION"
          echo "Branch: master"
          echo "Tag: ${{ github.ref_name }}"
          # Thêm logic deploy production của bạn ở đây
          # Ví dụ:
          # - Build Docker image
          # - Push to production registry
          # - Deploy to production cluster
          # - Run smoke tests

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production Github Action thành công!"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Chỉ chạy khi push tag vào branch staging và tag có suffix -stg
    if: |
      github.ref_type == 'tag' && 
      startsWith(github.ref_name, 'v') && 
      endsWith(github.ref_name, '-stg') &&
      github.event.base_ref == 'refs/heads/staging'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stg$ ]]; then
            echo "❌ Tag format không hợp lệ. Yêu cầu format: v1.x.x-stg"
            exit 1
          fi
          echo "✅ Tag format hợp lệ: $TAG_NAME"

      - name: Verify branch is staging
        run: |
          BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/staging' || true)
          if [ -z "$BRANCH" ]; then
            echo "❌ Tag không thuộc branch staging"
            exit 1
          fi
          echo "✅ Tag thuộc branch staging"

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying version ${{ github.ref_name }} to STAGING"
          echo "Branch: staging"
          echo "Tag: ${{ github.ref_name }}"
          # Thêm logic deploy staging của bạn ở đây
          # Ví dụ:
          # - Build Docker image
          # - Push to staging registry
          # - Deploy to staging cluster
          # - Run integration tests

      - name: Notify success
        if: success()
        run: |
          echo "✅ Staging Github Action thành công!"

  slack-notification-production:
    name: Slack Notification - Production
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && needs.deploy-production.result != 'skipped'
    
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.deploy-production.result == 'success' && '✅ Production Github Action Success' || '❌ Production Github Action Failed' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nProduction 🚀"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.deploy-production.result == 'success' && 'Success ✅' || 'Failed ❌' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\nmaster"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.repository.html_url }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* <${{ github.event.repository.html_url }}|${{ github.repository }}>"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Workflow: `${{ github.workflow }}` | Run #${{ github.run_number }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  slack-notification-staging:
    name: Slack Notification - Staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always() && needs.deploy-staging.result != 'skipped'
    
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.deploy-staging.result == 'success' && '✅ Staging Github Action Success' || '❌ Staging Github Action Failed' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nStaging 🧪"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.deploy-staging.result == 'success' && 'Success ✅' || 'Failed ❌' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\nstaging"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.repository.html_url }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* <${{ github.event.repository.html_url }}|${{ github.repository }}>"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Workflow: `${{ github.workflow }}` | Run #${{ github.run_number }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK